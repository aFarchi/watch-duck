[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [
    {name = "Alban Farchi", email = "alban.farchi@ecmwf.int"},
]
dependencies = [
    "numpy",
    "pandas",
    "rich",
    "xarray",
    "zarr",
]
name = "watch-duck"
requires-python = ">= 3.11"
version = "0.1.0"

[tool.ruff]
preview = true

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"

[tool.ruff.lint]
flake8-quotes.inline-quotes = "single"
pydocstyle.convention = "google"
pylint.allow-magic-value-types = ["int", "str"]
pylint.max-args = 15
pylint.max-locals = 20
pylint.max-statements = 75
select = ["ALL"]
ignore = [
    # no anotations
    "ANN",
    # no copyright on files
    "CPY001",
    # no docstrings
    "D",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
watch-duck = { path = ".", editable = true }

[tool.pixi.tasks]
lint = "ruff check"
format = "ruff format --config \"lint.ignore = ['COM812']\""

[tool.pixi.dependencies]
numpy = ">=2.4.3,<3"
pandas = ">=3.0.2,<4"
xarray = ">=2026.2.0,<2027"
zarr = ">=3.1.5,<4"
pixi-pycharm = ">=0.0.11,<0.0.12"
rich = ">=14.3.3,<15"
ruff = ">=0.15.9,<0.16"
dask = ">=2026.3.0,<2027"
distributed = ">=2026.3.0,<2027"
jupyterlab = ">=4.5.6,<5"
